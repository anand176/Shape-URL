spring.application.name=demo

# H2 in-memory database — data resets every time the app restarts (fine for learning)
spring.datasource.url=jdbc:h2:mem:shortener;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create/update tables from your @Entity classes on startup
spring.jpa.hibernate.ddl-auto=update
# Optional: browse the DB in a web UI at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
